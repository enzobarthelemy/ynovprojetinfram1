stages:
  - deploy

variables:
  AWS_DEFAULT_REGION: us-east-1

.base:
  image: nikolaik/python-nodejs:python3.13-nodejs20
  before_script:
    - pip install awscli aws-cdk-lib constructs
    - npm install -g aws-cdk
    - cd infra
    - pip install -r requirements.txt

deploy-vpc:
  extends: .base
  stage: deploy
  script:
    - export AMI_ID=$(aws ssm get-parameter --name /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2 --query "Parameter.Value" --output text)
    - cdk synth VpcStack
    - aws cloudformation deploy --template-file cdk.out/VpcStack.template.json --stack-name VpcStack --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset
  only:
    changes:
      - infra/stacks/vpc_stack.py

