stages:
  - deploy-network
  - deploy-security
  - check-secrets
  - deploy
  - deploy-efs
  - deploy-s3-primary

variables:
  AWS_DEFAULT_REGION: us-east-1
  AWS_PRIMARY_REGION: us-east-1
  AWS_SECONDARY_REGION: us-west-2

.base:
  image: nikolaik/python-nodejs:python3.13-nodejs20
  resource_group: aws-deploy
  before_script:
    - pip install awscli aws-cdk-lib constructs
    - npm install -g aws-cdk
    - cd infra
    - pip install -r requirements.txt

deploy-vpc:
  extends: .base
  stage: deploy-network
  script:
    - cdk synth VpcStackPrimary VpcStackSecondary
    - aws cloudformation deploy --template-file cdk.out/VpcStackPrimary.template.json --stack-name VpcStackPrimary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_PRIMARY_REGION
    - aws cloudformation deploy --template-file cdk.out/VpcStackSecondary.template.json --stack-name VpcStackSecondary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_SECONDARY_REGION
  only:
    changes:
      - infra/stacks/vpc_stack.py

deploy-sg:
  extends: .base
  stage: deploy-security
  script:
    - export VPC_PRIMARY_ID=$(aws cloudformation describe-stacks --stack-name VpcStackPrimary --region $AWS_PRIMARY_REGION --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue" --output text)
    - export VPC_SECONDARY_ID=$(aws cloudformation describe-stacks --stack-name VpcStackSecondary --region $AWS_SECONDARY_REGION --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue" --output text)
    - cdk synth SgStackPrimary SgStackSecondary
    - aws cloudformation wait stack-update-complete --stack-name SgStackPrimary --region $AWS_PRIMARY_REGION 2>/dev/null || true
    - aws cloudformation deploy --template-file cdk.out/SgStackPrimary.template.json --stack-name SgStackPrimary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_PRIMARY_REGION
    - aws cloudformation wait stack-update-complete --stack-name SgStackSecondary --region $AWS_SECONDARY_REGION 2>/dev/null || true
    - aws cloudformation deploy --template-file cdk.out/SgStackSecondary.template.json --stack-name SgStackSecondary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_SECONDARY_REGION
  only:
    changes:
      - infra/stacks/sg_stack.py

check-secrets:
  image: nikolaik/python-nodejs:python3.13-nodejs20
  stage: check-secrets
  before_script:
    - pip install awscli --quiet
  script:
    - |
      SECRETS=("prod/wordpress/db" "prod/wordpress/app")
      REGIONS=("$AWS_PRIMARY_REGION" "$AWS_SECONDARY_REGION")
      MISSING=0
      for REGION in "${REGIONS[@]}"; do
        for SECRET in "${SECRETS[@]}"; do
          aws secretsmanager describe-secret \
            --secret-id "$SECRET" \
            --region "$REGION" \
            --query "Name" \
            --output text > /dev/null 2>&1 \
          && echo "OK  [$REGION] $SECRET" \
          || { echo "MANQUANT  [$REGION] $SECRET"; MISSING=1; }
        done
      done
      if [ $MISSING -eq 1 ]; then
        echo ""
        echo "Des secrets sont manquants. Creez-les avec :"
        echo "  aws secretsmanager create-secret --name prod/wordpress/db --region <REGION> --secret-string '{\"host\":\"...\",\"port\":\"3306\",\"name\":\"wordpress\",\"username\":\"...\",\"password\":\"...\"}'"
        echo "  aws secretsmanager create-secret --name prod/wordpress/app --region <REGION> --secret-string '{\"admin_user\":\"...\",\"admin_password\":\"...\",\"admin_email\":\"...\"}'"
        exit 1
      fi
  only:
    changes:
      - infra/stacks/asg_stack.py
      - infra/scripts/user_data.sh

deploy-ec2:
  extends: .base
  stage: deploy
  script:
    - export AMI_ID=$(aws ssm get-parameter --name /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2 --query "Parameter.Value" --output text)
    - cdk synth Ec2StackPrimary Ec2StackSecondary
    - aws cloudformation deploy --template-file cdk.out/Ec2StackPrimary.template.json --stack-name Ec2StackPrimary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_PRIMARY_REGION
    - aws cloudformation deploy --template-file cdk.out/Ec2StackSecondary.template.json --stack-name Ec2StackSecondary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_SECONDARY_REGION
  only:
    changes:
      - infra/stacks/ec2_stack.py

deploy-alb:
  extends: .base
  stage: deploy
  script:
    - cdk synth AlbStackPrimary AlbStackSecondary
    - aws cloudformation deploy --template-file cdk.out/AlbStackPrimary.template.json --stack-name AlbStackPrimary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_PRIMARY_REGION
    - aws cloudformation deploy --template-file cdk.out/AlbStackSecondary.template.json --stack-name AlbStackSecondary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_SECONDARY_REGION
  only:
    changes:
      - infra/stacks/alb_stack.py

deploy-asg:
  extends: .base
  stage: deploy
  needs:
    - check-secrets
  script:
    - cdk synth AsgStackPrimary AsgStackSecondary
    - aws cloudformation deploy --template-file cdk.out/AsgStackPrimary.template.json --stack-name AsgStackPrimary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_PRIMARY_REGION
    - aws cloudformation deploy --template-file cdk.out/AsgStackSecondary.template.json --stack-name AsgStackSecondary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_SECONDARY_REGION
  only:
    changes:
      - infra/stacks/asg_stack.py
      - infra/scripts/user_data.sh

deploy-efs-primary:
  extends: .base
  stage: deploy-efs
  script:
    - export WEB_SUBNET_PRIMARY_1=$(aws cloudformation describe-stacks --stack-name VpcStackPrimary --region $AWS_PRIMARY_REGION --query "Stacks[0].Outputs[?OutputKey=='WebSubnet1Id'].OutputValue" --output text)
    - export WEB_SUBNET_PRIMARY_2=$(aws cloudformation describe-stacks --stack-name VpcStackPrimary --region $AWS_PRIMARY_REGION --query "Stacks[0].Outputs[?OutputKey=='WebSubnet2Id'].OutputValue" --output text)
    - export EFS_SG_PRIMARY=$(aws cloudformation describe-stacks --stack-name SgStackPrimary --region $AWS_PRIMARY_REGION --query "Stacks[0].Outputs[?OutputKey=='EfsSgId'].OutputValue" --output text)
    - cdk synth EfsStackPrimary
    - aws cloudformation deploy --template-file cdk.out/EfsStackPrimary.template.json --stack-name EfsStackPrimary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_PRIMARY_REGION --parameter-overrides WebSubnet1Id=$WEB_SUBNET_PRIMARY_1 WebSubnet2Id=$WEB_SUBNET_PRIMARY_2 EfsSgId=$EFS_SG_PRIMARY
    # Attendre que la réplication soit initialisée puis sauvegarder l'ID dans un artifact
    - sleep 30
    - aws efs describe-replication-configurations --region $AWS_PRIMARY_REGION --query "Replications[0].Destinations[0].FileSystemId" --output text > efs_secondary_id.txt
    - echo "EFS Secondary ID = $(cat efs_secondary_id.txt)"
  artifacts:
    paths:
      - efs_secondary_id.txt
    expire_in: 1 hour
  only:
    changes:
      - infra/stacks/efs_stack.py

deploy-efs-secondary:
  extends: .base
  stage: deploy-efs
  needs:
    - job: deploy-efs-primary
      artifacts: true
  script:
    - export EFS_SECONDARY_ID=$(cat efs_secondary_id.txt)
    - export WEB_SUBNET_SECONDARY_1=$(aws cloudformation describe-stacks --stack-name VpcStackSecondary --region $AWS_SECONDARY_REGION --query "Stacks[0].Outputs[?OutputKey=='WebSubnet1Id'].OutputValue" --output text)
    - export WEB_SUBNET_SECONDARY_2=$(aws cloudformation describe-stacks --stack-name VpcStackSecondary --region $AWS_SECONDARY_REGION --query "Stacks[0].Outputs[?OutputKey=='WebSubnet2Id'].OutputValue" --output text)
    - export EFS_SG_SECONDARY=$(aws cloudformation describe-stacks --stack-name SgStackSecondary --region $AWS_SECONDARY_REGION --query "Stacks[0].Outputs[?OutputKey=='EfsSgId'].OutputValue" --output text)
    - cdk synth EfsStackSecondary
    - aws cloudformation deploy --template-file cdk.out/EfsStackSecondary.template.json --stack-name EfsStackSecondary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_SECONDARY_REGION --parameter-overrides WebSubnet1Id=$WEB_SUBNET_SECONDARY_1 WebSubnet2Id=$WEB_SUBNET_SECONDARY_2 EfsSgId=$EFS_SG_SECONDARY EfsSecondaryFsId=$EFS_SECONDARY_ID
  only:
    changes:
      - infra/stacks/efs_stack.py

deploy-s3-secondary:
  extends: .base
  stage: deploy
  script:
    - cdk synth S3StackSecondary
    - aws cloudformation deploy --template-file cdk.out/S3StackSecondary.template.json --stack-name S3StackSecondary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_SECONDARY_REGION
  only:
    changes:
      - infra/stacks/s3_stack.py

deploy-s3-primary:
  extends: .base
  stage: deploy-s3-primary
  script:
    - cdk synth S3StackPrimary
    - aws cloudformation deploy --template-file cdk.out/S3StackPrimary.template.json --stack-name S3StackPrimary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_PRIMARY_REGION
  only:
    changes:
      - infra/stacks/s3_stack.py

deploy-rds:
  extends: .base
  stage: deploy
  script:
    - export DB_SUBNET_PRIMARY_1_ID=$(aws cloudformation describe-stacks --stack-name VpcStackPrimary --region $AWS_PRIMARY_REGION --query "Stacks[0].Outputs[?OutputKey=='DbSubnet1Id'].OutputValue" --output text)
    - export DB_SUBNET_PRIMARY_2_ID=$(aws cloudformation describe-stacks --stack-name VpcStackPrimary --region $AWS_PRIMARY_REGION --query "Stacks[0].Outputs[?OutputKey=='DbSubnet2Id'].OutputValue" --output text)
    - export DB_SUBNET_SECONDARY_1_ID=$(aws cloudformation describe-stacks --stack-name VpcStackSecondary --region $AWS_SECONDARY_REGION --query "Stacks[0].Outputs[?OutputKey=='DbSubnet1Id'].OutputValue" --output text)
    - export DB_SUBNET_SECONDARY_2_ID=$(aws cloudformation describe-stacks --stack-name VpcStackSecondary --region $AWS_SECONDARY_REGION --query "Stacks[0].Outputs[?OutputKey=='DbSubnet2Id'].OutputValue" --output text)
    - export DB_SG_PRIMARY_ID=$(aws cloudformation describe-stacks --stack-name SgStackPrimary --region $AWS_PRIMARY_REGION --query "Stacks[0].Outputs[?OutputKey=='DbSgId'].OutputValue" --output text)
    - export DB_SG_SECONDARY_ID=$(aws cloudformation describe-stacks --stack-name SgStackSecondary --region $AWS_SECONDARY_REGION --query "Stacks[0].Outputs[?OutputKey=='DbSgId'].OutputValue" --output text)
    - cdk synth RdsStackPrimary RdsStackSecondary
    - aws cloudformation deploy --template-file cdk.out/RdsStackPrimary.template.json --stack-name RdsStackPrimary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_PRIMARY_REGION --parameter-overrides DbSubnet1Id=$DB_SUBNET_PRIMARY_1_ID DbSubnet2Id=$DB_SUBNET_PRIMARY_2_ID DbSgId=$DB_SG_PRIMARY_ID "DbPassword=$DB_PASSWORD"
    - export SOURCE_DB_ARN="arn:aws:rds:${AWS_PRIMARY_REGION}:${AWS_ACCOUNT_ID}:db:wordpress-rds-primary"
    - aws cloudformation deploy --template-file cdk.out/RdsStackSecondary.template.json --stack-name RdsStackSecondary --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --region $AWS_SECONDARY_REGION --parameter-overrides DbSubnet1Id=$DB_SUBNET_SECONDARY_1_ID DbSubnet2Id=$DB_SUBNET_SECONDARY_2_ID DbSgId=$DB_SG_SECONDARY_ID SourceDbArn=$SOURCE_DB_ARN
  only:
    changes:
      - infra/stacks/rds_stack.py
