stages:
  - secrets           # Secrets Manager (2 regions) - statiques
  - deploy-secondary  # InfraSecondaryStack (us-west-2) : cree le bucket S3 cible CRR
  - deploy-primary    # InfraPrimaryStack (us-east-1) : tout + S3 CRR vers secondary
  - dr                # DR : snapshot RDS cross-region (planifie horaire / manuel)

variables:
  AWS_DEFAULT_REGION: us-east-1
  AWS_PRIMARY_REGION: us-east-1
  AWS_SECONDARY_REGION: us-west-2

.base:
  image: nikolaik/python-nodejs:python3.13-nodejs20
  resource_group: aws-deploy   # serialise les deploiements (pas 2 en parallele)
  before_script:
    - pip install awscli aws-cdk-lib constructs --quiet
    - npm install -g aws-cdk
    - cd infra

# ============================================================
# 1. Secrets (statiques : pas de RDS host, injecte via token dans le user_data)
# ============================================================
secrets:
  extends: .base
  stage: secrets
  script:
    - |
      WP_ADMIN_PW="${WP_ADMIN_PASSWORD:-$DB_PASSWORD}"
      WP_DB_PW="${WP_DB_PASSWORD:-$DB_PASSWORD}"
      WP_ADMIN_MAIL="${WP_ADMIN_EMAIL:-admin@ynov.com}"
      cu() { aws secretsmanager create-secret --name "$1" --secret-string "$2" --region "$3" 2>/dev/null \
             || aws secretsmanager put-secret-value --secret-id "$1" --secret-string "$2" --region "$3" >/dev/null; echo "OK $3 $1"; }
      for R in "$AWS_PRIMARY_REGION" "$AWS_SECONDARY_REGION"; do
        cu "prod/wordpress/db-admin" "{\"port\":\"3306\",\"name\":\"wordpress\",\"username\":\"admin\",\"password\":\"$DB_PASSWORD\"}" "$R"
        cu "prod/wordpress/db" "{\"port\":\"3306\",\"name\":\"wordpress\",\"username\":\"wordpress\",\"password\":\"$WP_DB_PW\"}" "$R"
        cu "prod/wordpress/app" "{\"admin_user\":\"admin\",\"admin_password\":\"$WP_ADMIN_PW\",\"admin_email\":\"$WP_ADMIN_MAIL\"}" "$R"
      done
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - infra/**/*

# ============================================================
# 2. Region secondaire (us-west-2) - en premier (cible CRR S3)
# ============================================================
deploy-secondary:
  extends: .base
  stage: deploy-secondary
  script:
    - cdk deploy InfraSecondaryStack --require-approval never
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - infra/**/*

# ============================================================
# 3. Region primaire (us-east-1) - apres (S3 CRR vers secondary)
# ============================================================
deploy-primary:
  extends: .base
  stage: deploy-primary
  script:
    # Recupere le DNS de l'ALB secondaire (deja deploye) pour les records Route53 failover
    - export ALB_DNS_SECONDARY=$(aws elbv2 describe-load-balancers --names wp-alb-secondary --region $AWS_SECONDARY_REGION --query "LoadBalancers[0].DNSName" --output text)
    - echo "ALB secondaire = $ALB_DNS_SECONDARY"
    - cdk deploy InfraPrimaryStack --require-approval never -c alb_dns_secondary="$ALB_DNS_SECONDARY"
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - infra/**/*

# ============================================================
# 4. DR : snapshot RDS primary + copie cross-region us-west-2
#    Planifie horaire (GitLab Schedule, cron "0 * * * *") ou manuel.
#    Restauration au failover : restore-db-instance-from-db-snapshot en us-west-2.
# ============================================================
rds-snapshot-dr:
  image: nikolaik/python-nodejs:python3.13-nodejs20
  stage: dr
  before_script:
    - pip install awscli --quiet
  script:
    - TS=$(date +%Y%m%d-%H%M%S)
    - SNAP="wordpress-primary-snap-$TS"
    # 1. Snapshot du RDS primary (us-east-1)
    - echo "Creation snapshot $SNAP..."
    - aws rds create-db-snapshot --db-instance-identifier wordpress-rds-primary --db-snapshot-identifier "$SNAP" --region $AWS_PRIMARY_REGION
    - aws rds wait db-snapshot-available --db-snapshot-identifier "$SNAP" --region $AWS_PRIMARY_REGION
    # 2. Copie cross-region vers us-west-2
    - echo "Copie vers $AWS_SECONDARY_REGION..."
    - SRC_ARN="arn:aws:rds:${AWS_PRIMARY_REGION}:${AWS_ACCOUNT_ID}:snapshot:${SNAP}"
    - aws rds copy-db-snapshot --source-db-snapshot-identifier "$SRC_ARN" --target-db-snapshot-identifier "$SNAP" --region $AWS_SECONDARY_REGION
    # 3. Retention : garde les 3 derniers dans chaque region
    - |
      for R in $AWS_PRIMARY_REGION $AWS_SECONDARY_REGION; do
        OLD=$(aws rds describe-db-snapshots --region $R --snapshot-type manual \
          --query "reverse(sort_by(DBSnapshots[?starts_with(DBSnapshotIdentifier,'wordpress-primary-snap-')], &SnapshotCreateTime))[3:].DBSnapshotIdentifier" \
          --output text)
        for S in $OLD; do echo "Suppression ancien snapshot $S ($R)"; aws rds delete-db-snapshot --db-snapshot-identifier "$S" --region $R; done
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
      allow_failure: true
