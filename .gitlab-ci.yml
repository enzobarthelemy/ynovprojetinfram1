stages:
  - deploy

deploy:
  stage: deploy
  image: nikolaik/python-nodejs:python3.13-nodejs20
  before_script:
    - pip install aws-cdk-lib constructs
    - npm install -g aws-cdk
    - cd cdk-ec2
    - pip install -r requirements.txt
  script:
    - cdk deploy --require-approval never
  variables:
    AWS_DEFAULT_REGION: us-east-1
  only:
    - mt